name: Tests Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  tests-review:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Tests Review
        id: test-review
        uses: anthropics/claude-code-action@v1

        env: 
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
        with:
          prompt: review tests for the following PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            review tests by using the following skill - test-review
            after reviewing add inline comments about bad tests and PR comment about missing tests
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git:*),Bash(rg:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment)'
          show_full_output: true