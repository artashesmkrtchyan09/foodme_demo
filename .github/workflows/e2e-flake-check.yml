name: E2E flake check

# Runs chosen Playwright specs N times against a real backend to prove they are
# not flaky. Started by the feature-qa workflow (step 11, qa-flake-check skill):
#   gh workflow run e2e-flake-check.yml --ref <branch> -f app=web -f specs="e2e/cart.spec.ts" -f repeat=10
# Retries are off and the backend keeps its simulated 200-1500 ms latency,
# because that latency is what exposes waiting bugs.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which Playwright suite"
        type: choice
        options: [web, admin]
        default: web
      specs:
        description: "Space-separated spec paths relative to apps/<app> (e.g. e2e/cart.spec.ts). Empty = whole suite."
        type: string
        default: ""
      repeat:
        description: "How many times to run each test"
        type: string
        default: "10"

concurrency:
  group: e2e-flake-check-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  flake-check:
    name: Flake check (${{ inputs.app }} x${{ inputs.repeat }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          SPECS: ${{ inputs.specs }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          [[ "$REPEAT" =~ ^[1-9][0-9]?$ ]] || { echo "::error::repeat must be 1-99, got '$REPEAT'"; exit 1; }
          for s in $SPECS; do
            [[ "$s" =~ ^e2e/[A-Za-z0-9._/-]+\.spec\.ts$ ]] || { echo "::error::invalid spec path '$s'"; exit 1; }
            [[ "$s" != *..* ]] || { echo "::error::'..' not allowed in '$s'"; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is git-ignored (*.jar), so ./gradlew fails on a fresh
      # checkout. Install the pinned Gradle version and regenerate the jar.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          build-root-directory: apps/backend

      - name: Generate Gradle wrapper jar
        working-directory: apps/backend
        run: |
          gradle wrapper --gradle-version 8.6
          git checkout -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      # Simulated latency stays ON (default profile): it is what exposes flaky waits.
      - name: Start backend
        working-directory: apps/backend
        run: |
          nohup ./gradlew bootRun > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"
              exit 0
            fi
            echo "waiting for backend... ($i)"
            sleep 5
          done
          echo "backend did not become healthy in time"
          tail -n 100 "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - name: Install dependencies and Playwright
        working-directory: apps/${{ inputs.app }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run specs ${{ inputs.repeat }} times
        working-directory: apps/${{ inputs.app }}
        env:
          CI: "true"
          SPECS: ${{ inputs.specs }}
          REPEAT: ${{ inputs.repeat }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          # shellcheck disable=SC2086  # SPECS is a validated, space-separated list
          npx playwright test $SPECS --repeat-each="$REPEAT" --retries=0 --reporter=json,html

      - name: Summarize pass counts
        if: always()
        working-directory: apps/${{ inputs.app }}
        env:
          REPEAT: ${{ inputs.repeat }}
        run: |
          [ -f results.json ] || { echo "No results.json (run failed before tests)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const r = require("./results.json"); const rows = new Map();
            const walk = (s, path) => {
              const p = s.title ? [...path, s.title] : path;
              for (const spec of s.specs || []) for (const t of spec.tests || []) {
                const key = `${spec.file} › ${[...p.slice(1), spec.title].join(" › ")}`;
                const row = rows.get(key) || { pass: 0, total: 0, errors: new Set() };
                row.total++;
                if (t.status === "expected" || t.status === "skipped") row.pass++;
                else for (const res of t.results || []) for (const e of res.errors || [])
                  row.errors.add(String(e.message || "").split("\n")[0].replace(/\u001b\[[0-9;]*m/g, "").slice(0, 160));
                rows.set(key, row);
              }
              for (const c of s.suites || []) walk(c, p);
            };
            for (const s of r.suites || []) walk(s, []);
            const lines = ["## E2E flake check", "", `Repeat: ${process.env.REPEAT} · retries off · latency on`, "",
              "| Test | Passed/Total | Verdict | First error lines |", "|---|---|---|---|"];
            let flaky = 0;
            for (const [k, v] of rows) {
              const ok = v.pass === v.total; if (!ok) flaky++;
              lines.push(`| ${k} | ${v.pass}/${v.total} | ${ok ? "stable" : v.pass === 0 ? "broken" : "flaky"} | ${[...v.errors].join("<br>").replace(/\|/g, "\\|")} |`);
            }
            lines.push("", `**Result:** ${flaky === 0 ? "stable" : flaky + " unstable test(s)"}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-check-${{ inputs.app }}
          path: |
            apps/${{ inputs.app }}/results.json
            apps/${{ inputs.app }}/playwright-report/
          if-no-files-found: warn

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake-check-backend-log
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: ignore
