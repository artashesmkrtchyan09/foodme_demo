name: Claude Mutation Testing

# A Claude agent mutates the code this PR adds or changes, per module, and runs that
# module's tests after every mutation (skill: mutation-test). Reports are uploaded as
# artifacts; "Claude Mutation Testing Gate" turns them into the commit status
# "quality-gate/mutation-testing". The agent only edits the runner's working tree,
# nothing is committed or pushed.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the report script
        run: node --test .github/scripts/mutation-report.test.mjs

      - name: Find modules with changed source
        id: modules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          modules=()
          for m in backend web admin; do
            if echo "$changed" | grep -E "^apps/$m/src/" | grep -vE "^apps/backend/src/test/" | grep -q .; then
              modules+=("$m")
            fi
          done
          json=$(printf '%s\n' "${modules[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "$json" > modules.json
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "Modules to mutate: $json"

      - name: Upload module list
        uses: actions/upload-artifact@v4
        with:
          name: mutation-modules
          path: modules.json

  mutate:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is git-ignored (*.jar), so ./gradlew fails on a fresh
      # checkout. Install the pinned Gradle version and regenerate the jar.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          build-root-directory: apps/backend

      - name: Generate Gradle wrapper jar
        working-directory: apps/backend
        run: |
          gradle wrapper --gradle-version 8.6
          # keep the tracked wrapper files untouched; only the ignored jar is new
          git checkout -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
          git status --porcelain

      # The web and admin E2E suites run against the real backend.
      - name: Start backend
        if: matrix.module != 'backend'
        working-directory: apps/backend
        run: |
          nohup ./gradlew bootRun > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"
              exit 0
            fi
            echo "waiting for backend... ($i)"
            sleep 5
          done
          echo "backend did not become healthy in time"
          tail -n 100 "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Set up Node 20
        if: matrix.module != 'backend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ matrix.module }}/package-lock.json

      - name: Install dependencies and Playwright
        if: matrix.module != 'backend'
        working-directory: apps/${{ matrix.module }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Claude mutation testing
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          prompt: |
            Mutation-test the module ${{ matrix.module }} of PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Use the mutation-test skill for module ${{ matrix.module }} with threshold ${{ vars.MUTATION_SCORE_THRESHOLD || '70' }}.
            Write mutation-report-${{ matrix.module }}.json to the repository root, exactly in the schema the skill defines, and list every mutant in it.
            Revert every mutation. Do not commit, push or comment on the PR.
          claude_args: '--allowedTools "Read,Write,Edit,Grep,Glob,Bash(git:*),Bash(cd:*),Bash(curl:*),Bash(./gradlew:*),Bash(npm:*),Bash(npx playwright:*),Bash(npx tsc:*),Bash(npx eslint:*)"'
          show_full_output: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.module }}
          path: mutation-report-${{ matrix.module }}.json
          if-no-files-found: warn
