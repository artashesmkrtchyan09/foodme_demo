name: Claude Tests Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-tests-review:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Tests Review
        id: claude-tests-review
        uses: anthropics/claude-code-action@v1

        env: 
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
        with:
          prompt: |
            review tests for the following PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            review tests by using the following skill - test-review
            after reviewing add inline comments about bad tests and PR comment about missing tests
            the PR comment about missing tests must start with the line <!-- claude-tests-review --> so it can be found later
            the PR comment must also contain the line **Verdict:** PASS or **Verdict:** CHANGES REQUESTED, exactly as the test-review skill defines it, because the Claude Tests Review Gate workflow reads it. Post the comment even when there are no findings
            do not create a new PR comment if one already exists: list the PR comments (gh pr view --json comments, which gives each comment url), find the one containing <!-- claude-tests-review -->, and if found overwrite its body with the new review by running gh api -X PATCH repos/${{ github.repository }}/issues/comments/<comment id> -f body=<new comment>; the comment id is the number after issuecomment- in the url; create a new PR comment with gh pr comment only if no such comment exists
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git:*),Bash(rg:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api -X PATCH:*),mcp__github_inline_comment__create_inline_comment"'
          show_full_output: true