name: Claude Jira Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-jira-review:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run Claude Jira Review
        id: claude-jira-review
        uses: anthropics/claude-code-action@v1

        env: 
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JIRA_OAUTH_TOKEN: ${{ secrets.JIRA_OAUTH_TOKEN }}
          
        with:
          prompt: |
            review Jira issue againts the changes in the PR, after review add a PR comment about how much the implementation relevant to the task described in the jira ticket, what is done and what not
             - PR: ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
             - PR title: ${{ github.event.pull_request.title }}
             - Get Jira ticket number from the PR title, which has the following format: <SCRUM-number>
             - Jira tiket: Get jira ticket by using the following tool: mcp__mcp-atlassian__jira_get_issue
             - The PR comment must start with the line <!-- claude-jira-review --> so it can be found later
             - The PR comment must also contain the line **Verdict:** PASS or **Verdict:** CHANGES REQUESTED, because the Claude Jira Review Gate workflow reads it. Use PASS only when the PR fully implements what the ticket asks for. Use CHANGES REQUESTED when part of the ticket is not done, the PR does something the ticket does not ask for, the ticket number is missing from the PR title, or the ticket cannot be read
             - Do not create a new PR comment if one already exists: list the PR comments (gh pr view --json comments, which gives each comment url), find the one containing <!-- claude-jira-review -->, and if found overwrite its body with the new review by running gh api -X PATCH repos/${{ github.repository }}/issues/comments/<comment id> -f body=<new comment>; the comment id is the number after issuecomment- in the url. Create a new PR comment with gh pr comment only if no such comment exists
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*), Bash(gh api -X PATCH:*), mcp__github_inline_comment__create_inline_comment, mcp__mcp-atlassian__jira_get_issue"'
          show_full_output: true