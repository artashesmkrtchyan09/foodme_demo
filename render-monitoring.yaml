# FoodMe monitoring stack — SEPARATE blueprint, deploy AFTER the main app,
# into the same region.
#
# autoDeploy is OFF here on purpose, unlike the app in render.yaml. The free
# plan has no persistent disk, so every redeploy WIPES all stored metrics and
# logs. Rebuilding this service on app code pushes — which never change it —
# would throw away your observability data each time you commit. Flip it to
# true only if you are actually editing infra/monitoring/.
#
# ONE service runs Prometheus + Loki + Grafana + the Grafana MCP behind nginx.
# They talk to each other over loopback inside the container, so none of the
# internal wiring needs URLs. That matters here: Render's free web services can
# SEND private-network requests but cannot RECEIVE them, so private hostnames
# (foodme-loki:10000, ...) never resolve, and each split-out service would have
# needed its neighbours' per-deploy *.onrender.com URLs pasted in by hand.
#
# What you must still set by hand — ONE variable, because the backend is a
# genuinely separate service:
#   BACKEND_HOST  = your backend's public host, no scheme and no port
#                   e.g. foodme-armanayvazyan-xxxx.onrender.com
# And one on the BACKEND side (in render.yaml's service):
#   LOKI_PUSH_URL = https://<this service>.onrender.com/loki/api/v1/push
#
# Routes on the resulting public URL:
#   /        Grafana (login admin / admin)
#   /prom/   Prometheus
#   /loki/   Loki  (the app pushes to /loki/api/v1/push)
#   /mcp     Grafana MCP (streamable-http)
#
# Retention is 2 days (Prometheus --storage.tsdb.retention.time=48h, Loki
# compactor with retention_period 48h). Note the free plan has no persistent
# disk, so in practice data is also lost on every restart/spin-down; attach a
# disk on a paid plan if you need it to survive.

services:
  - type: web
    name: foodme-monitoring
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./infra/monitoring/stack/Dockerfile
    # Context is the monitoring dir so the Dockerfile can COPY stack/*.
    dockerContext: ./infra/monitoring
    # Grafana owns "/", so its health endpoint is the stack's health check.
    healthCheckPath: /api/health
    envVars:
      # The one hop that leaves the container: Prometheus scrapes the backend
      # over https on :443, because free services can't be reached privately.
      - key: BACKEND_HOST
        sync: false
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: admin
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      # The MCP queries Grafana as the admin user (basic auth) via the
      # entrypoint — nothing to set here. We deliberately do NOT use a
      # GRAFANA_SERVICE_ACCOUNT_TOKEN: it would live in Grafana's
      # wiped-on-redeploy SQLite DB and go stale after every deploy.
